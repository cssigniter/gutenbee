<!DOCTYPE html>
<!--
	Hosts the YouTube embeds of GutenBee's blocks inside the block editor.
	The editor's canvas is an iframe whose document is a blob, so embeds placed in it don't send a referrer,
	and YouTube refuses to play them (error 153). The blocks place the embed in this page instead.
	See getYouTubeEmbedHost() in src/util/video/providers.js
-->
<html data-gutenbee-video-embed-frame>
<head>
	<meta charset="utf-8">
	<meta name="robots" content="noindex">
	<title>GutenBee video embed</title>
	<style>
		html,
		body {
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: transparent;
		}

		iframe {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
		}
	</style>
</head>
<body></body>
</html>
